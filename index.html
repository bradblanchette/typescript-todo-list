<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Todo App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="container">
        <h1>Todo List</h1>
    </header>
    <main class="container">
        <form id="todo-form">
            <fieldset role="group">
                <input id="todo-input" type="text" name="todo" placeholder="Add a todo" aria-label="New todo" autocomplete="off" required />
                <button type="submit">Add</button>
            </fieldset>
        </form>
    </main>
    <footer class="container">
        <small>Made by Brad Blanchette - <a href="https://github.com/bradblanchette/typescript-todo-list" target="_blank">View on GitHub</a></small>
    </footer>
    <script type="module" src="dist/index.js"></script>
</body>
</html>
